# touchpad-accel curve (libinput "custom" acceleration profile)
#
# UNITS: for touchpads, libinput evaluates the custom curve in RAW touchpad
# units, NOT normalized to 1000 dpi like the other profiles.
# This curve was made for 24 units/mm (Framework 13 Pro, PIXA3854 touchpad);
# measure.py shows the resolution of yours.
#   x = finger speed in units/ms  (here: 1 u/ms = ~42 mm/s)
#   y = pointer speed in px/ms
# Points are at x = 0, step, 2*step, ...; linear extrapolation past the last one.
# Always write numbers with a decimal point.
#
# Default: gain ~0.5 for slow, precise movement (0.48 below 0.25 u/ms, 0.5 at
# 0.5 u/ms), smooth transition, then the same as all bundled curves (gain ~1.5
# at 3 u/ms, ~2.3 at 5 u/ms, ~2.5 at 6 u/ms).
#
# Gain knots (x: gain): 0: 0.48, 0.25: 0.48, 0.5: 0.5, 0.75: 0.66, 1: 0.84, 1.25: 1, 1.5: 1.05, 2: 1.2, 2.5: 1.4, 3: 1.6, 4: 2, 5: 2.3, 6: 2.5
motion_step   0.25
motion_points 0 0.12 0.25 0.495 0.84 1.25 1.575 1.969 2.4 2.925 3.5 4.125 4.8 5.525 6.3 7.125 8 8.819 9.675 10.569 11.5 12.337 13.2 14.088 15

# Optional click lock: stops the pointer shifting when a press rolls the finger or
# it snaps back on release. Both default to 0 (off); needs a re-login after updating.
#   click_lock_mm    extra travel after a press before the pointer moves, on top
#                    of libinput's own 1.5 mm. Dragging starts that much later.
#   release_lock_ms  pointer stays still this long after the release, even if
#                    the finger keeps moving.
#click_lock_mm   0.5
#release_lock_ms 120

# Optional scroll curve. Without one, libinput scrolls flat 1:1 in raw device
# units instead of at its usual scroll speed, which can be too fast, especially
# on high-resolution touchpads. The lines below are exactly that flat 1:1 curve:
# uncomment them and lower the points to scroll slower.
#scroll_step   1.0
#scroll_points 0 1 2 3 4

# Optional settings per device, for touchpads with a different resolution. Applies
# to devices whose name contains the text (case-sensitive; the journal and
# `libinput list-devices` show the names) and overrides only what it lists.
# A section lasts until the next one, so keep them at the end of this file.
# Same feel as above: motion_step = 0.25 * R / 24, with R in units/mm of that device.
#[device "Magic Trackpad"]
#motion_step     0.49
#click_lock_mm   0
#release_lock_ms 0
