# touchpad-accel curve (libinput "custom" acceleration profile)
#
# UNITS: for touchpads, libinput evaluates the custom curve in RAW touchpad
# units, NOT normalized to 1000 dpi like the other profiles.
# This curve was made for 24 units/mm (Framework 13 Pro, PIXA3854 touchpad);
# measure.py shows the resolution of yours.
#   x = finger speed in units/ms  (here: 1 u/ms = ~42 mm/s)
#   y = pointer speed in px/ms
# Points are at x = 0, step, 2*step, ...; linear extrapolation past the last one.
# Always write numbers with a decimal point.
#
# Variant: gain 0.5 for slow, precise movement (below ~0.3 u/ms), smooth
# transition, then the same as all bundled curves (gain ~1.5 at 3 u/ms,
# ~2.3 at 5 u/ms, ~2.5 at 6 u/ms).
#
# Gain knots (x: gain): 0: 0.5, 0.25: 0.5, 0.5: 0.6, 0.75: 0.74, 1: 0.89, 1.25: 1, 1.5: 1.05, 2: 1.2, 2.5: 1.4, 3: 1.6, 4: 2, 5: 2.3, 6: 2.5
motion_step   0.25
motion_points 0 0.125 0.3 0.555 0.89 1.25 1.575 1.969 2.4 2.925 3.5 4.125 4.8 5.525 6.3 7.125 8 8.819 9.675 10.569 11.5 12.337 13.2 14.088 15

# Optional separate scroll curve; commented out = libinput default
#scroll_step   1.0
#scroll_points 0 1 2 3 4
